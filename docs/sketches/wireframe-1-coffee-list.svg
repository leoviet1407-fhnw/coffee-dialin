" stroke-width="1"/><text x="380" y="435" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">250</text><text x="372" y="462" font-family="Inter" font-size="11" font-weight="400" fill="#666666" text-anchor="start">prefilled</text><text x="552" y="408" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Roast date</text><rect x="552" y="414" width="200" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="560" y="435" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">dd.mm.yyyy</text><text x="552" y="462" font-family="Inter" font-size="11" font-weight="400" fill="#666666" text-anchor="start">not in the future</text><text x="52" y="506" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">“Other…” shows Name, Origin and Roast level fields instead of the PHIN prefill.</text><rect x="52" y="560" width="170" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="137.0" y="583.0" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">ADD COFFEE</text></svg>