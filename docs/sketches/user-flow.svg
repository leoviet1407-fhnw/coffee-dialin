<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1870" viewBox="0 0 1380 1870"><rect width="1380" height="1870" fill="#FFFFFF" stroke="#000000"/><text x="30" y="50" font-family="Inter" font-size="20" font-weight="700" fill="#000000" text-anchor="start">PHIN Dial-in · user flow (log a brew until it is dialed in)</text><text x="30" y="74" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Rounded = start/end · rectangle = screen or action · diamond = decision · codes in brackets = API response</text><rect x="440" y="130" width="200" height="50" rx="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="540.0" y="159.55" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Open PHIN Dial-in</text><rect x="420" y="220" width="240" height="60" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="245.55" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Coffee list</text><text x="540.0" y="263.55" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">cards with grams left</text><polygon points="540.0,320 640,375.0 540.0,430 440,375.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="370.7" font-family="Inter" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">Coffee already</text><text x="540.0" y="387.7" font-family="Inter" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">in the list?</text><rect x="420" y="470" width="240" height="50" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="499.55" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">Tap the coffee card</text><rect x="420" y="560" width="240" height="60" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="585.55" font-family="Inter" font-size="13" font-weight="700" fill="#000000" 