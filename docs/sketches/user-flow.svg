text x="540.0" y="1223.55" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">subtract the dose from stock (201)</text><polygon points="540.0,1280 640,1335.0 540.0,1390 440,1335.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="1330.7" font-family="Inter" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">Fewer than</text><text x="540.0" y="1347.7" font-family="Inter" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">3 brews left?</text><rect x="420" y="1430" width="240" height="60" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="1455.55" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">Show ratio, time status</text><text x="540.0" y="1473.55" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">and ONE advice for the next brew</text><polygon points="540.0,1530 640,1585.0 540.0,1640 440,1585.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="1580.7" font-family="Inter" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">Tasted</text><text x="540.0" y="1597.7" font-family="Inter" font-size="12" font-weight="400" fill="#000000" text-anchor="middle">balanced?</text><rect x="420" y="1680" width="240" height="60" rx="0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="540.0" y="1705.55" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Press SAVE AS RECIPE</text><text x="540.0" y="1723.55" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">replaces the old recipe for this method</text><rect x="440" y="1780" width="200" height="50" rx="25.0" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="540.0" y="1800.55" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Recipe card shows</text><text x="540.0" y="1818