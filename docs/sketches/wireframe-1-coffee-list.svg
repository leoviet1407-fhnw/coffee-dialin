<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="1000" height="660" fill="#FFFFFF" stroke="#000000"/><rect x="0" y="0" width="1000" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="16" y="30" font-family="Inter" font-size="15" font-weight="700" fill="#000000" text-anchor="start">[PHIN logo]  Dial-in</text><text x="984" y="30" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="end" text-decoration="underline">Coffees</text><text x="32" y="92" font-family="Inter" font-size="26" font-weight="700" fill="#000000" text-anchor="start">YOUR COFFEES</text><text x="32" y="118" font-family="Inter" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Pick a coffee to log a brew, or add the bag you just opened.</text><rect x="32" y="144" width="296" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="48" y="176" font-family="Inter" font-size="18" font-weight="700" fill="#000000" text-anchor="start" text-decoration="underline">Hanoi Haze</text><text x="48" y="198" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">100% Vietnamese Arabica</text><text x="48" y="236" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">210 g left · about 11 brews</text><text x="48" y="294" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Phin: recipe saved · Espresso: dialing</text><rect x="352" y="144" width="296" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="368" y="176" font-family="Inter" font-size="18" font-weight="700" fill="#000000" text-anchor="start" text-decoration="underline">Da Lat Dawn</text><text x="368" y="198" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Robusta &amp; Arabica blend</text><text x="368" y="236" font-family="Inter" font-size="13" font-weight="400" fill="#0