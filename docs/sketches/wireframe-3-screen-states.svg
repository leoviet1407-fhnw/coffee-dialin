<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1060" viewBox="0 0 1340 1060"><rect width="1340" height="1060" fill="#FFFFFF" stroke="#000000"/><text x="20" y="36" font-family="Inter" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Screen states · parts of the coffee detail that change</text><text x="20" y="84" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">A · Missing input</text><text x="20" y="102" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">LOG BREW without a taste → 422</text><rect x="20" y="112" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><text x="40" y="140" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Dose (g)</text><rect x="40" y="146" width="110" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="48" y="167" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">18</text><text x="165" y="140" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Water (ml)</text><rect x="165" y="146" width="110" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="173" y="167" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">140</text><text x="290" y="140" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Drip time (m:ss)</text><rect x="290" y="146" width="130" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="298" y="167" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">4:30</text><text x="40" y="214" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Taste</text><rect x="40" y="220" width="380" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="50.0" y="241" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">○ Sour</text><text x="170.0" y="241" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">○ Balanced</text><text x="290.0" y="241" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">○ Bitter</text><text x="40" y="280" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">⚠ Taste: choose sour, balanced or bitter.</text><rect x="40" y="312" width="140" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="110.0" y="335.0" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">LOG BREW</text><text x="196" y="335" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Other values are kept.</text><text x="460" y="84" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">B · Not enough coffee</text><text x="460" y="102" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">LOG BREW with 18 g when 6 g are left → 409</text><rect x="460" y="112" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="480" y="132" width="380" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="494" y="157" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">6 g left · not enough for a brew</text><rect x="480" y="188" width="380" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="494" y="214" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">⚠ Only 6 g left. Add a new bag first.</text><text x="494" y="234" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Nothing was saved.</text><rect x="480" y="268" width="130" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="545.0" y="291.0" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">NEW BAG</text><text x="630" y="291" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start" text-decoration="underline">Reorder on phinkafi.ch</text><text x="900" y="84" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">C · Running low</text><text x="900" y="102" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">brew saved, fewer than 3 brews left</text><rect x="900" y="112" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="920" y="132" width="380" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="934" y="157" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">40 g left · about 2 brews</text><rect x="920" y="188" width="380" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="934" y="214" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">⚠ Running low: about 2 brews left.</text><text x="934" y="234" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Order a new bag so you don't run out.</text><text x="920" y="280" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start" text-decoration="underline">Reorder on phinkafi.ch (opens a new tab)</text><text x="20" y="414" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">D · New bag</text><text x="20" y="432" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">NEW BAG → bag added to stock (200)</text><rect x="20" y="442" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="50" y="458" width="360" height="236" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="70" y="488" font-family="Inter" font-size="15" font-weight="700" fill="#000000" text-anchor="start">ADD A NEW BAG</text><text x="70" y="516" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Bag size (g)</text><rect x="70" y="522" width="140" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="78" y="543" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">250</text><text x="230" y="516" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">Roast date</text><rect x="230" y="522" width="160" height="32" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="238" y="543" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">dd.mm.yyyy</text><text x="70" y="592" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">40 g left + 250 g → 290 g left</text><rect x="70" y="638" width="120" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="130.0" y="661.0" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">ADD BAG</text><rect x="210" y="638" width="100" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="260" y="661" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">Cancel</text><text x="460" y="414" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">E · Recipe saved</text><text x="460" y="432" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">SAVE AS RECIPE on a balanced brew → 200</text><rect x="460" y="442" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="480" y="462" width="380" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="494" y="487" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="start">✓ Saved as your Phin recipe. It replaces the previous one.</text><rect x="480" y="518" width="380" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="494" y="541" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Phin recipe</text><text x="494" y="562" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">18 g · 135 ml · 93 °C · 4:50 drip · grind 6</text><text x="480" y="610" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">The button only appears on balanced brews,</text><text x="480" y="628" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">so a sour or bitter brew cannot become the recipe.</text><text x="900" y="414" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">F · Delete a brew</text><text x="900" y="432" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">Delete → confirm → removed, dose returned (204)</text><rect x="900" y="442" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="930" y="472" width="360" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="950" y="504" font-family="Inter" font-size="15" font-weight="700" fill="#000000" text-anchor="start">DELETE THIS BREW?</text><text x="950" y="538" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Brew #2 (18 g) is removed from the log</text><text x="950" y="558" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">and 18 g are returned to stock.</text><rect x="950" y="602" width="110" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1005.0" y="625.0" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">DELETE</text><rect x="1080" y="602" width="100" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="1130" y="625" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">Keep</text><text x="20" y="744" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">G · Coffee not found</text><text x="20" y="762" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">open a coffee that does not exist → 404</text><rect x="20" y="772" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="40" y="812" width="380" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="230" y="856" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">We couldn't find this coffee.</text><text x="230" y="878" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">It may have been deleted.</text><text x="230" y="950" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle" text-decoration="underline">← Back to your coffees</text><text x="460" y="744" font-family="Inter" font-size="14" font-weight="700" fill="#000000" text-anchor="start">H · First brew</text><text x="460" y="762" font-family="Inter" font-size="12" font-weight="400" fill="#666666" text-anchor="start">new coffee, no brews yet</text><rect x="460" y="772" width="420" height="270" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><rect x="480" y="792" width="380" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="6 4"/><text x="494" y="814" font-family="Inter" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Phin recipe</text><text x="494" y="832" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="start">No recipe yet.</text><rect x="480" y="862" width="380" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="670" y="900" font-family="Inter" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">No brews yet.</text><text x="670" y="926" font-family="Inter" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">Start with PHIN's guide: 18 g · 130 ml · 93 °C · 4–6 min</text></svg>